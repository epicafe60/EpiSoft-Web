# EpiSoft-Web full stack: PostgreSQL (from deploy/db), the application and Caddy.
# One-command deployment (spec §5.6), from this folder:
#   docker compose up -d --build
# Once images are published by CI:  docker compose pull && docker compose up -d
#
# Settings come from docker/.env (see .env.example). The database settings and passwords
# stay in deploy/db/.env.

name: episoft-web

include:
  - ../deploy/db/compose.yml

services:
  api:
    image: ${APP_IMAGE:-episoft-web:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      # The server itself only (backup scripts report here); the public door is Caddy.
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      DATABASE_URL: postgres://episoft_app:${EPISOFT_APP_PASSWORD:?set in docker/.env}@postgres:5432/episoft
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  caddy-data:
  caddy-config:
